# KEYON — nginx HTML edge-assist cache maps
# Included from /etc/nginx/conf.d/ (http context).

proxy_cache_path /var/cache/nginx/keyon
  levels=1:2
  keys_zone=keyon_html:20m
  max_size=256m
  inactive=10m
  use_temp_path=off;

# Empty = full document navigation (not Next.js Flight/RSC).
map "$http_rsc$http_next_router_state_tree$http_next_router_prefetch$http_next_router_segment_prefetch" $keyon_is_flight {
    default 1;
    ""      0;
}

map $http_cookie $keyon_has_session {
    default 0;
    ~*keyon_session= 1;
}

# Cloudflare CDN cache directive — never store Flight payloads at the HTML URL.
map $keyon_is_flight $keyon_cf_cdn_cc {
    0 "public, max-age=60";
    1 "no-store";
}
